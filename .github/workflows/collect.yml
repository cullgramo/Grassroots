name: Collect fixtures

on:
  schedule:
    - cron: '7 4 * * *' # backup, in case the later one is delayed or skipped: about 4am Irish time in winter
    - cron: '17 5 * * *' # every morning, about 5am Irish time
  workflow_dispatch:
    inputs:
      dry:
        description: Dry run (report only, save nothing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collect-fixtures
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://dxkurwkmbnireaptcsbd.supabase.co
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: Check the readers
        run: node --test collector/test/*.test.mjs

      - name: Collect fixtures
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          # The GAA's Foireann API. Empty (so the reader stays off) until Foireann issues us a key.
          FOIREANN_API_KEY: ${{ secrets.FOIREANN_API_KEY }}
          FOIREANN_OWNER_ID: ${{ vars.FOIREANN_OWNER_ID }}
          DRY: ${{ inputs.dry && '1' || '0' }}
        run: node collector/run.mjs

      - name: Keep the list of fixtures left out
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: left-out
          path: collector-report/left-out.csv
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep today's per-source counts for the watchdog
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-stats
          path: collector-report/run-stats.json
          if-no-files-found: ignore
          retention-days: 3

  # Runs after every collection, even a failed one, and raises (or closes) a "data-watchdog" issue. See collector/watchdog.mjs.
  watchdog:
    needs: collect
    # Not for dry runs (nothing was saved, and they are for trying things out) or a run someone cancelled.
    if: ${{ always() && needs.collect.result != 'cancelled' && needs.collect.result != 'skipped' && inputs.dry != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      SUPABASE_URL: https://dxkurwkmbnireaptcsbd.supabase.co
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        continue-on-error: true # none when the run died before reporting; the watchdog then raises that
        with:
          name: run-stats
          path: collector-report

      - name: Check every source
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COLLECT_RESULT: ${{ needs.collect.result }}
        run: node collector/watchdog.mjs
