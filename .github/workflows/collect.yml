name: Collect fixtures

on:
  schedule:
    - cron: '17 5 * * *' # every morning, about 5am Irish time
  workflow_dispatch:
    inputs:
      dry:
        description: Dry run (report only, save nothing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collect-fixtures
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://dxkurwkmbnireaptcsbd.supabase.co
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: Check the readers
        run: node --test collector/test/*.test.mjs

      - name: Collect fixtures
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          DRY: ${{ inputs.dry && '1' || '0' }}
        run: node collector/run.mjs

      - name: Keep the list of fixtures left out
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: left-out
          path: collector-report/left-out.csv
          if-no-files-found: ignore
          retention-days: 14
