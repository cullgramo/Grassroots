name: Collect fixtures

on:
  schedule:
    - cron: '17 5 * * *' # every morning, about 5am Irish time
  workflow_dispatch:
    inputs:
      dry:
        description: Dry run (report only, save nothing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collect-fixtures
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://dxkurwkmbnireaptcsbd.supabase.co
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Check the readers
        run: node --test collector/test/readers.test.mjs

      - name: Apply database changes
        if: ${{ !inputs.dry }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: ./collector/migrate.sh

      - name: Collect fixtures
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          DRY: ${{ inputs.dry && '1' || '0' }}
        run: node collector/run.mjs
