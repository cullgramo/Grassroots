name: Collect fixtures

on:
  # Meant to run early each morning, Irish time. The times below are the evening before, on purpose: every day from
  # 15 to 20 November 2026 GitHub started scheduled runs of this workflow between 8 hours 40 minutes and 9 hours
  # 20 minutes after the time set (04:07 and 05:17 UTC ran at about 12:45 and 14:10). Set for 19:07 and 20:17 UTC, they
  # should land at about 04:00 and 05:30. If GitHub starts running them on time, they run in the evening instead: still
  # once a day plus a backup, which is what every request tells the sites it reads.
  schedule:
    - cron: '7 19 * * *' # first run: expected to start at about 04:00 UTC
    - cron: '17 20 * * *' # backup, in case the first is skipped: expected to start at about 05:30 UTC
  workflow_dispatch:
    inputs:
      dry:
        description: Dry run (report only, save nothing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collect-fixtures
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://dxkurwkmbnireaptcsbd.supabase.co
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: Check the readers
        run: node --test collector/test/*.test.mjs

      - name: Collect fixtures
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          # The GAA's Foireann API. Empty (so the reader stays off) until Foireann issues us a key.
          FOIREANN_API_KEY: ${{ secrets.FOIREANN_API_KEY }}
          FOIREANN_OWNER_ID: ${{ vars.FOIREANN_OWNER_ID }}
          DRY: ${{ inputs.dry && '1' || '0' }}
        run: node collector/run.mjs

      - name: Keep the list of fixtures left out
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: left-out
          path: collector-report/left-out.csv
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep today's per-source counts for the watchdog
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-stats
          path: collector-report/run-stats.json
          if-no-files-found: ignore
          retention-days: 3

  # After the collection: compare each source with the past week and tell the owner when one has broken or dropped.
  # It keeps a single GitHub issue (opened, updated or closed as things change), so nothing is repeated every morning.
  watchdog:
    name: Data watchdog
    needs: collect
    if: ${{ always() && !inputs.dry }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      SUPABASE_URL: https://dxkurwkmbnireaptcsbd.supabase.co
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch today's per-source counts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: run-stats
          path: collector-report

      - name: Check every source against the past week
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          COLLECT_RESULT: ${{ needs.collect.result }}
        run: node collector/watchdog.mjs
