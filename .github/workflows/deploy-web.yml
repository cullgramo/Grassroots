name: Deploy web

# Publishes the web version to grassroots.expo.app whenever the app changes on main, so a merge reaches the website
# without anyone running commands. It can also be started by hand from the Actions page.
#
# Needs one secret, entered in GitHub only: EXPO_TOKEN (expo.dev, Account settings, Access tokens).
# Optional secret: EXPO_PUBLIC_MAPTILER_KEY, the web map's tile key; without it the map uses OpenStreetMap's own tiles.
# The Expo project is @aggfh/grassroots; its ID is in app.json (expo.extra.eas.projectId).
#
# Until the token is in place nothing is published, and the run says so in a notice. That is not a failure: the publish
# job is skipped, so a merge does not show a red mark or send a failure email for something not switched on yet.
on:
  push:
    branches: [main]
    # Changes to the collector, the database files or documents do not change the website.
    paths-ignore:
      - 'collector/**'
      - 'supabase/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/collect.yml'
      - '.github/workflows/checks.yml'
      - '.github/workflows/snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer merge replaces a deploy still waiting.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  ready:
    name: Is publishing set up?
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Look for the Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::Not published: EXPO_TOKEN is not set yet. Add it under Settings, Secrets and variables, Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build and publish the website
    needs: ready
    if: needs.ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_MAPTILER_KEY: ${{ secrets.EXPO_PUBLIC_MAPTILER_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      # A build that does not typecheck or pass its tests is not published.
      - run: npx tsc --noEmit
      - run: npx jest --silent
      - name: Build the website
        run: npx expo export --platform web
      - name: Publish to grassroots.expo.app
        run: npx eas-cli@latest deploy --prod --non-interactive
