<!doctype html>
<!--
  The app shown inside a phone frame, for looking at it on a computer screen: grassroots.expo.app/phone.html
  The frame holds the real website (the page at "/"), so everything in it works. It is a viewing aid only, and is
  kept out of search results.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Grassroots: phone preview</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
         background: #10231C; color: #C9D6CE; font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
  /* The stage is the size of the scaled phone, so the caption sits right under it. */
  #stage { position: relative; }
  #phone { position: absolute; top: 0; left: 0; width: 390px; height: 844px; padding: 12px; border-radius: 56px;
           background: #0A0F0D; box-shadow: 0 0 0 2px #2B3A33, 0 30px 80px rgba(0,0,0,.5); transform-origin: top left; }
  #phone iframe { width: 390px; height: 844px; border: 0; border-radius: 44px; background: #fff; display: block; }
  #bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; align-items: center; }
  button { font: inherit; color: #10231C; background: #7BE0B4; border: 0; border-radius: 16px; padding: 6px 14px; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  a { color: #7BE0B4; }
</style>
</head>
<body>
  <div id="stage"><div id="phone"><iframe id="app" src="/" title="Grassroots app" allow="geolocation; clipboard-write; web-share"></iframe></div></div>
  <div id="bar">
    <span>Grassroots · phone preview (390 × 844)</span>
    <button id="reload" type="button">Start again</button>
    <a href="/">Open without the frame</a>
  </div>
<script>
  // Fit the whole phone on the screen, never larger than life.
  var W = 414, H = 868, stage = document.getElementById('stage'), phone = document.getElementById('phone');
  function fit() {
    var s = Math.min(1, (window.innerHeight - 70) / H, (window.innerWidth - 24) / W);
    phone.style.transform = 'scale(' + s + ')';
    stage.style.width = Math.round(W * s) + 'px';
    stage.style.height = Math.round(H * s) + 'px';
  }
  window.addEventListener('resize', fit); fit();
  document.getElementById('reload').addEventListener('click', function () { document.getElementById('app').src = '/'; });
</script>
</body>
</html>
